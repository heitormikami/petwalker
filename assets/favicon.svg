<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Vibrant Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7844" />
      <stop offset="50%" stop-color="#FF5A1F" />
      <stop offset="100%" stop-color="#E23E09" />
    </linearGradient>

    <!-- Top Gloss Light -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Paw Symbol Gradient -->
    <linearGradient id="pawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF3EB" />
    </linearGradient>

    <!-- Accent Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7540" />
      <stop offset="100%" stop-color="#FF4810" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#801C00" flood-opacity="0.32" />
    </filter>
    
    <!-- Paw Glow Filter -->
    <filter id="pawShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#731900" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Inner Subtle Border -->
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3" />

  <!-- Top Glass Highlight Reflection -->
  <path d="M 16 124 C 16 64 64 16 124 16 L 388 16 C 448 16 496 64 496 124 C 496 160 410 180 256 180 C 102 180 16 160 16 124 Z" fill="url(#glossGrad)" />

  <!-- Central Paw Emblem -->
  <g filter="url(#pawShadow)" transform="translate(0, 10)">
    <!-- Main Center Pad (Modern stylized heart-pad) -->
    <path d="M 256 260 
             C 210 260 165 295 165 350 
             C 165 395 205 425 256 425 
             C 307 425 347 395 347 350 
             C 347 295 302 260 256 260 Z" 
          fill="url(#pawGrad)" />
    
    <!-- Heart Inlay inside Main Pad -->
    <path d="M 256 322
             C 246 308 226 308 216 320
             C 204 335 208 355 226 372
             L 256 398
             L 286 372
             C 304 355 308 335 296 320
             C 286 308 266 308 256 322 Z"
          fill="url(#heartGrad)" opacity="0.9" />

    <!-- Toe 1: Far Left -->
    <ellipse cx="152" cy="225" rx="34" ry="46" transform="rotate(-28 152 225)" fill="url(#pawGrad)" />

    <!-- Toe 2: Center Left -->
    <ellipse cx="218" cy="180" rx="36" ry="52" transform="rotate(-10 218 180)" fill="url(#pawGrad)" />

    <!-- Toe 3: Center Right -->
    <ellipse cx="294" cy="180" rx="36" ry="52" transform="rotate(10 294 180)" fill="url(#pawGrad)" />

    <!-- Toe 4: Far Right -->
    <ellipse cx="360" cy="225" rx="34" ry="46" transform="rotate(28 360 225)" fill="url(#pawGrad)" />
  </g>

  <!-- Sparkle / Star in upper right corner -->
  <path d="M 405 90 Q 405 115 380 115 Q 405 115 405 140 Q 405 115 430 115 Q 405 115 405 90 Z" fill="#FFFFFF" opacity="0.85" />
</svg>